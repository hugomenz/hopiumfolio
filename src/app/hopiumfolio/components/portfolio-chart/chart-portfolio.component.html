<div class="chart-container" *ngIf="hasData">
  <div class="hopium-card">
    <div class="hopium-card-header">
      <h3 class="hopium-card-title">
        <mat-icon>pie_chart</mat-icon>
        Portfolio Allocation
      </h3>
    </div>
    
    <ngx-charts-pie-chart
      [view]="view"
      [scheme]="colorScheme"
      [results]="chartData"
      [gradient]="gradient"
      [legend]="showLegend"
      [legendPosition]="legendPosition"
      [labels]="showLabels"
      [maxLabelLength]="maxLabelLength"
      [doughnut]="isDoughnut"
      [explodeSlices]="isExplodeSlices"
      (select)="onSelect($event)"
      (activate)="onActivate($event)"
      (deactivate)="onDeactivate($event)"
      [customColors]="colorScheme"
    >
    </ngx-charts-pie-chart>
  </div>
</div>

<div class="empty-chart" *ngIf="!hasData">
  <div class="hopium-card text-center">
    <mat-icon class="large-icon text-muted">pie_chart_outlined</mat-icon>
    <h3 class="text-muted">No Portfolio Data</h3>
    <p class="text-muted">Add cryptocurrencies to your portfolio to see the allocation chart!</p>
  </div>
</div>
